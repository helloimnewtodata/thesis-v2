[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-v2"
version = "0.1.0"
description = "Empirical Asset Pricing via Machine Learning — Cross-Sectional Return Predictability in European Equities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Christian Nikolajeff" },
    { name = "Niklas Reijonen" },
]

# Riippuvuudet pidetään synkassa requirements.txt:n kanssa.
dependencies = [
    "numpy>=1.22.4,<1.29",
    "pandas>=1.3.5,<3.0.0",
    "scipy<1.13.0",
    "refinitiv-data==1.6.2",
    "scikit-learn>=1.1.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.13.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "requests>=2.28.0",
    "transformers>=4.25.0",
    "torch>=1.13.0",
    "hmmlearn>=0.3.0",
    "shap>=0.42.0",
    "antropy>=0.2.2",
    "joblib>=1.5.3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "pandas-stubs<3.0.0",
]

# config.py on repon juuressa oleva kirjastomoduuli (jaetut päivämäärät /
# sektoridummy-määritykset). Varsinainen pipeline-kirjasto on src/pipeline.py.
[tool.setuptools]
py-modules = ["config"]

# Pakettihaku: src/ on olemassa, scripts/ / diagnostics/ / experiments/
# luodaan vaiheissa 3A ja 3B ja niihin lisätään __init__.py.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "diagnostics*", "experiments*"]
exclude = ["archive*", "venv*", "data*", "results*", "notebooks*"]
